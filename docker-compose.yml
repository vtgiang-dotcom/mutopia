services:
  database:
    image: postgres:15-alpine
    container_name: openmu-db
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    ports:
      - "5438:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openmu-server:
    build:
      context: ./src/server-s6/src
      dockerfile: Startup/Dockerfile
    container_name: openmu-server
    ports:
      - "8080:8080"
      - "44406:44406"
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_DATABASE: openmu
      ASPNETCORE_URLS: http://+:8080
      RESOLVE_IP: "127.0.0.1"
    depends_on:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openmu-playerweb:
    build:
      context: ./src/web-portal
      dockerfile: Dockerfile
    container_name: openmu-playerweb
    ports:
      - "3007:8080"
    environment:
      ConnectionStrings__OpenMu: "Host=database;Port=5432;Database=openmu;Username=postgres;Password=admin"
      GameserverUrl: "http://openmu-server:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      - database
      - openmu-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  dbdata:

